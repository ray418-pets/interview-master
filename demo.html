<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试陪练 · 项目演示</title>
<style>
/* ==========================================================================
   面试陪练 · 项目演示（自包含单文件，纯前端 Mock，无需后端）
   中式编辑风格：纸色底 / 墨色文字 / 朱红强调 / 衬线标题 / 细线分隔
   ========================================================================== */
:root {
  --paper: #F2F4F5; --ink: #14212B; --seal: #C53A2E; --seal-dark: #A8322A;
  --slate: #5B6770; --hairline: #D7DDE1; --white: #FFFFFF;
  --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-full: 999px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.3; margin: 0; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
ul { margin: 0; padding: 0; list-style: none; }
button { font: inherit; cursor: pointer; color: inherit; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

/* 演示横幅 */
.demo-banner {
  background: var(--ink); color: var(--white); text-align: center;
  font-size: 0.8125rem; padding: 6px 16px; letter-spacing: 0.02em;
}

/* 视图切换 */
.view { display: none; }
.view.active { display: block; }

/* 布局 */
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
.wrap-narrow { max-width: 760px; margin: 0 auto; padding: 0 24px; }

/* 顶栏 */
.topbar { border-bottom: 1px solid var(--hairline); background: var(--paper); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 1.125rem; font-weight: 600; }
.brand-mark { width: 28px; height: 28px; flex-shrink: 0; }
.topbar-right { display: flex; align-items: center; gap: 20px; }
.user-name { font-size: 0.9375rem; color: var(--ink); }
.nav-link { font-size: 0.9375rem; color: var(--slate); }
.nav-link:hover { color: var(--ink); }
.nav-link.active { color: var(--ink); font-weight: 600; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 28px; border: none; border-radius: var(--r-sm);
  font-size: 1rem; font-weight: 600; transition: background 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--seal); color: var(--white); }
.btn-primary:hover { background: var(--seal-dark); }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

/* 表单 */
.field { margin-bottom: 20px; }
.field-label { display: block; font-size: 0.9375rem; font-weight: 600; margin-bottom: 8px; }
.field-hint { font-weight: 400; color: var(--slate); font-size: 0.8125rem; }
.input, .textarea {
  width: 100%; padding: 12px 14px; font-size: 1rem; color: var(--ink);
  background: var(--white); border: 1px solid var(--hairline); border-radius: var(--r-sm);
}
.input:focus, .textarea:focus { outline: none; border-color: var(--ink); }
.textarea { min-height: 120px; resize: vertical; }
.form-error, .form-hint { font-size: 0.875rem; margin-top: 6px; display: none; }
.form-error { color: var(--seal); }
.form-hint { color: var(--slate); }
.form-error.visible, .form-hint.visible { display: block; }

/* 芯片 */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  padding: 9px 16px; border: 1px solid var(--hairline); border-radius: var(--r-full);
  background: var(--white); color: var(--ink); font-size: 0.9375rem;
}
.chip:hover { border-color: var(--slate); }
.chip.selected { background: var(--ink); border-color: var(--ink); color: var(--white); }

/* 计数器 */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--hairline); border-radius: var(--r-sm); background: var(--white); overflow: hidden; }
.stepper-btn { width: 44px; height: 44px; border: none; background: transparent; font-size: 1.25rem; }
.stepper-btn:hover { background: var(--paper); }
.stepper-value { min-width: 56px; text-align: center; font-weight: 600; }
.stepper-total { margin-left: 12px; font-size: 0.875rem; color: var(--slate); }

/* 卡片 / 标签 / 列表 */
.card { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 24px; margin-bottom: 20px; }
.card-title { font-size: 1.125rem; margin-bottom: 12px; }
.card-body { white-space: pre-wrap; }
.tag { display: inline-block; padding: 2px 10px; border-radius: var(--r-full); font-size: 0.8125rem; font-weight: 600; border: 1px solid var(--hairline); background: var(--white); }
.tag.completed { background: var(--ink); color: var(--white); border-color: var(--ink); }
.tag.finished, .tag.in_progress { color: var(--slate); }
.tag.seal { color: var(--seal); border-color: var(--seal); }
.list { border-top: 1px solid var(--hairline); }
.list-item { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 4px; border-bottom: 1px solid var(--hairline); }
.list-item:hover { background: var(--white); }
.list-item-main { min-width: 0; }
.list-item-name { font-size: 1.0625rem; font-weight: 600; }
.list-item-desc { font-size: 0.875rem; color: var(--slate); margin-top: 4px; }
.list-item-side { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
.list-item-count { font-size: 0.875rem; color: var(--slate); }
.list-item-action { font-size: 0.9375rem; font-weight: 600; color: var(--seal); white-space: nowrap; }
.arrow { color: var(--slate); font-size: 1.125rem; }
.muted { opacity: 0.6; }
.state { color: var(--slate); padding: 24px 4px; font-size: 0.9375rem; text-align: center; }

/* 登录 */
.auth-shell { max-width: 420px; margin: 0 auto; padding: 60px 24px 64px; }
.auth-head { text-align: center; margin-bottom: 32px; }
.auth-logo { width: 44px; height: 44px; margin: 0 auto 16px; }
.auth-title { font-size: 1.75rem; margin-bottom: 8px; }
.auth-sub { color: var(--slate); font-size: 0.9375rem; }
.auth-switch { margin-top: 20px; text-align: center; color: var(--slate); font-size: 0.9375rem; }
.auth-switch a { color: var(--seal); font-weight: 600; cursor: pointer; }

/* 配置 */
.hero { padding: 60px 0 48px; }
.hero-inner { max-width: 720px; }
.hero-kicker { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.hero-speaker { font-size: 0.8125rem; color: var(--ink); font-weight: 600; }
.hero-index { font-size: 0.8125rem; color: var(--slate); }
.hero-question { font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.4rem); font-weight: 500; line-height: 1.5; margin-bottom: 28px; }
.section { padding: 32px 0 48px; }
.section-heading { font-size: 1.375rem; margin-bottom: 24px; }

/* 面试 */
.interview { padding: 40px 0 80px; }
.progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.progress { font-size: 0.9375rem; color: var(--slate); }
.progress-bar { height: 4px; background: var(--hairline); border-radius: 2px; overflow: hidden; margin-bottom: 32px; }
.progress-bar-fill { height: 100%; background: var(--seal); border-radius: 2px; transition: width 0.3s; }
.finish-link { font-size: 0.9375rem; color: var(--seal); font-weight: 600; background: none; border: none; padding: 0; }
.finish-link:hover { text-decoration: underline; }
.conversation { margin-bottom: 36px; }
.turn { padding: 20px 0; border-bottom: 1px solid var(--hairline); }
.turn-speaker { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--slate); margin-bottom: 8px; }
.turn-q .turn-text { font-family: var(--serif); font-size: 1.2rem; font-weight: 500; }
.turn-a .turn-text { white-space: pre-wrap; }
.turn-f { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 16px 20px; margin-top: 8px; }
.turn-f .turn-text { color: var(--slate); white-space: pre-wrap; }
.current-question { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 24px; }
.current-label { font-size: 0.8125rem; font-weight: 600; color: var(--slate); margin-bottom: 12px; }
.current-text { font-size: 1.5rem; font-weight: 500; line-height: 1.55; margin-bottom: 24px; }
.submit-row { display: flex; justify-content: flex-end; margin-top: 16px; }
.done-box { padding: 40px; text-align: center; }
.done-text { font-family: var(--serif); font-size: 1.375rem; font-weight: 600; margin-bottom: 24px; }

/* 报告 */
.report { padding: 40px 0 80px; }
.report-head { margin-bottom: 36px; }
.report-title { font-size: 1.75rem; margin-bottom: 8px; }
.report-meta { display: flex; gap: 8px; margin-top: 12px; }
.review { border-top: 1px solid var(--hairline); padding: 22px 0; }
.review-q { font-family: var(--serif); font-size: 1.0625rem; font-weight: 600; margin-bottom: 14px; }
.review-label { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--slate); margin-bottom: 4px; }
.review-body { white-space: pre-wrap; }
.review-f .review-body { color: var(--slate); }
.back-link { display: inline-block; margin-top: 8px; padding: 12px 24px; border: 1px solid var(--ink); border-radius: var(--r-sm); font-weight: 600; }
.back-link:hover { background: var(--white); }

/* 历史 */
.history { padding: 40px 0 80px; }
.page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
.page-title { font-size: 1.75rem; }
.page-count { font-size: 0.9375rem; color: var(--slate); }

.footer { border-top: 1px solid var(--hairline); padding: 28px 0 40px; color: var(--slate); font-size: 0.8125rem; }

@media (max-width: 640px) {
  .list-item { flex-direction: column; align-items: flex-start; gap: 12px; }
  .list-item-side { justify-content: space-between; width: 100%; }
  .current-text { font-size: 1.25rem; }
  .topbar-right { gap: 12px; }
}
</style>
</head>
<body>

<div class="demo-banner">项目演示 · 纯前端 Mock 数据 · 无需后端即可体验完整流程</div>

<header class="topbar" id="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#C53A2E"/><path d="M9 10h14a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-5l-3.5 3.5a.5.5 0 0 1-.85-.35V19H9a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z" fill="#FFFFFF"/><circle cx="12.5" cy="14" r="1.2" fill="#C53A2E"/><circle cx="16" cy="14" r="1.2" fill="#C53A2E"/><circle cx="19.5" cy="14" r="1.2" fill="#C53A2E"/></svg>面试陪练</a>

<!-- 视图：登录 -->
<section class="view" id="view-login">
  <main class="auth-shell">
    <div class="auth-head">
      <svg class="auth-logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#C53A2E"/><path d="M9 10h14a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-5l-3.5 3.5a.5.5 0 0 1-.85-.35V19H9a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z" fill="#FFFFFF"/><circle cx="12.5" cy="14" r="1.2" fill="#C53A2E"/><circle cx="16" cy="14" r="1.2" fill="#C53A2E"/><circle cx="19.5" cy="14" r="1.2" fill="#C53A2E"/></svg>

<!-- 视图：面试 -->

<script>
/* ==================== Mock 数据 ==================== */
const DIRECTION_LABELS = { technical_frontend:'技术-前端', technical_backend:'技术-后端', technical_algorithm:'技术-算法', product:'产品', operations:'运营', general:'通用' };
const TYPE_LABELS = { self_introduction:'自我介绍', technical:'技术题', behavioral:'行为题', project_experience:'项目经验题', open_ended:'开放题' };
const STATUS_LABELS = { in_progress:'进行中', completed:'已完成', finished:'已结束' };
const dirLabel = v => DIRECTION_LABELS[v] || v;
const typeLabel = v => TYPE_LABELS[v] || v;
const statusLabel = v => STATUS_LABELS[v] || v;
const totalCount = segs => (segs||[]).reduce((n,s)=>n+s.count,0);

const TEMPLATES = [
  { id:1, name:'前端开发面试', direction:'technical_frontend', segments:[{type:'self_introduction',count:1},{type:'technical',count:3},{type:'behavioral',count:2}] },
  { id:2, name:'后端开发面试', direction:'technical_backend', segments:[{type:'self_introduction',count:1},{type:'technical',count:3},{type:'behavioral',count:2}] },
  { id:3, name:'产品经理面试', direction:'product', segments:[{type:'self_introduction',count:1},{type:'behavioral',count:3},{type:'open_ended',count:1}] },
  { id:4, name:'通用行为面试', direction:'general', segments:[{type:'self_introduction',count:1},{type:'behavioral',count:2},{type:'open_ended',count:1}] },
];

const QUESTIONS = [
  '请做一个简短的自我介绍，谈谈你的教育背景和最近的一段项目经历。',
  '请描述一次你与团队协作解决冲突的经历。',
  '谈谈你未来三年的职业规划。',
];

const HISTORY = [
  { id:1042, direction:'general', total_questions:3, started_at:'2026-09-23 10:24', status:'finished' },
  { id:1038, direction:'technical_backend', total_questions:6, started_at:'2026-09-22 19:05', status:'completed' },
  { id:1027, direction:'product', total_questions:5, started_at:'2026-09-21 15:41', status:'completed' },
];

const REPORT = {
  direction:'general', status:'finished',
  overall_evaluation:'你已完整完成本次面试（3/3 题），整体表现良好，回答结构清晰，能够结合自身经历展开。',
  improvement_suggestions:'建议在行为题中更多地使用 STAR 法则组织回答，并补充可量化的结果数据。',
  questions:[
    { question_content:'请做一个简短的自我介绍……', user_answer:'我是一名前端工程师，有三年经验，最近负责了一个数据可视化项目……', feedback:'回答覆盖了全部参考要点，回答较完整。' },
    { question_content:'请描述一次你与团队协作解决冲突的经历。', user_answer:'在上一家公司，产品与研发对排期有分歧，我组织了沟通会……', feedback:'回答覆盖了部分要点，建议补充：解决问题。' },
    { question_content:'谈谈你未来三年的职业规划。', user_answer:'我希望在技术深度上持续精进，并逐步向架构方向成长……', feedback:'回答覆盖了部分要点，建议补充：学习能力。' },
  ],
};

/* ==================== 视图切换 ==================== */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.getElementById('topbar').style.display = (name === 'login') ? 'none' : '';
  document.getElementById('footer').style.display = (name === 'login') ? 'none' : '';
}
const footer = document.querySelector('.footer');

/* 导航 */
document.querySelectorAll('[data-nav]').forEach(a => {
  a.addEventListener('click', e => { e.preventDefault(); showView(a.dataset.nav); });
});

/* 退出 */
document.getElementById('logout').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('login-form').reset();
  showView('login');
});

/* ==================== 登录 ==================== */
let authMode = 'login';
const authTitle = document.getElementById('auth-title');
const authSub = document.getElementById('auth-sub');
const switchLink = document.getElementById('switch-link');
function renderAuthMode() {
  const isLogin = authMode === 'login';
  authTitle.textContent = isLogin ? '登录' : '创建账号';
  authSub.textContent = isLogin ? '用一个账号，保存你的每次练习记录' : '注册后开始你的模拟面试';
  switchLink.textContent = isLogin ? '注册' : '登录';
  document.querySelector('#login-form button[type=submit]').textContent = isLogin ? '登录' : '注册';
}
switchLink.addEventListener('click', () => { authMode = authMode === 'login' ? 'register' : 'login'; renderAuthMode(); });
document.getElementById('login-form').addEventListener('submit', e => {
  e.preventDefault();
  const u = document.getElementById('username-input').value.trim();
  if (!u) { document.getElementById('login-error').textContent = '请填写用户名'; document.getElementById('login-error').classList.add('visible'); return; }
  document.getElementById('username').textContent = u;
  renderTemplates();
  showView('config');
});
renderAuthMode();

/* ==================== 配置 ==================== */
function renderTemplates() {
  const list = document.getElementById('template-list');
  list.innerHTML = '';
  TEMPLATES.forEach(t => {
    const li = document.createElement('li');
    li.className = 'list-item';
    const desc = t.segments.map(s => `${typeLabel(s.type)} ${s.count} 题`).join('、');
    li.innerHTML = `
      <div class="list-item-main"><div class="list-item-name"></div><div class="list-item-desc"></div></div>
      <div class="list-item-side"><span class="list-item-count"></span><a class="list-item-action" href="#">开始</a></div>`;
    li.querySelector('.list-item-name').textContent = t.name;
    li.querySelector('.list-item-desc').textContent = `${dirLabel(t.direction)} · ${desc}`;
    li.querySelector('.list-item-count').textContent = `${totalCount(t.segments)} 题`;
    li.querySelector('.list-item-action').addEventListener('click', e => { e.preventDefault(); startInterview(totalCount(t.segments)); });
    list.appendChild(li);
  });
}
// 方向单选
document.querySelectorAll('#direction-chips .chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('#direction-chips .chip').forEach(x => x.classList.remove('selected'));
  c.classList.add('selected');
}));
// 题型多选
document.querySelectorAll('#type-chips .chip').forEach(c => c.addEventListener('click', () => c.classList.toggle('selected')));
// 数量
let count = 3;
const countValue = document.getElementById('count-value');
const countTotal = document.getElementById('count-total');
function renderCount() { countValue.textContent = count; countTotal.textContent = `共 ${count} 题（1–20）`; }
document.getElementById('count-minus').addEventListener('click', () => { if (count > 1) { count--; renderCount(); } });
document.getElementById('count-plus').addEventListener('click', () => { if (count < 20) { count++; renderCount(); } });
document.getElementById('custom-start').addEventListener('click', () => {
  const types = document.querySelectorAll('#type-chips .chip.selected');
  if (!types.length) { document.getElementById('config-error').textContent = '请至少选择一种题型'; document.getElementById('config-error').classList.add('visible'); return; }
  startInterview(count);
});
function startInterview(total) { initInterview(total); showView('interview'); }

/* ==================== 面试 ==================== */
let round = 1, interviewTotal = 3;
function initInterview(total) {
  round = 1; interviewTotal = total;
  document.getElementById('conversation').innerHTML = '';
  document.getElementById('answer').value = '';
  document.getElementById('hint').classList.remove('visible');
  document.getElementById('current-block').style.display = '';
  document.getElementById('done-block').style.display = 'none';
  renderInterview();
}
function renderInterview() {
  document.getElementById('progress').textContent = `第 ${round} 题 / 共 ${interviewTotal} 题`;
  document.getElementById('progress-bar-fill').style.width = `${(round / interviewTotal) * 100}%`;
  document.getElementById('current-text').textContent = QUESTIONS[(round - 1) % QUESTIONS.length];
}
function appendTurn(q, a, fb) {
  const div = document.createElement('div');
  div.className = 'turn';
  div.innerHTML = `
    <div class="turn-q"><span class="turn-speaker">面试官</span><div class="turn-text"></div></div>
    <div class="turn-a"><span class="turn-speaker">我的回答</span><div class="turn-text"></div></div>
    <div class="turn-f"><span class="turn-speaker">点评</span><div class="turn-text"></div></div>`;
  div.querySelectorAll('.turn-q .turn-text')[0].textContent = q;
  div.querySelectorAll('.turn-a .turn-text')[0].textContent = a;
  div.querySelectorAll('.turn-f .turn-text')[0].textContent = fb;
  document.getElementById('conversation').appendChild(div);
}
document.getElementById('submit').addEventListener('click', () => {
  const answer = document.getElementById('answer').value.trim();
  const hint = document.getElementById('hint');
  if (!answer) { hint.textContent = '请先输入回答'; hint.classList.add('visible'); return; }
  if (answer.length < 10) { hint.textContent = '回答过短，请至少输入 10 个字符后再提交。'; hint.classList.add('visible'); return; }
  hint.classList.remove('visible');
  appendTurn(QUESTIONS[(round - 1) % QUESTIONS.length], answer, '回答覆盖了部分要点，建议补充：关键词。');
  document.getElementById('answer').value = '';
  round++;
  if (round > interviewTotal) {
    document.getElementById('current-block').style.display = 'none';
    document.getElementById('done-block').style.display = 'block';
    document.getElementById('progress').textContent = `共 ${interviewTotal} 题`;
    document.getElementById('progress-bar-fill').style.width = '100%';
  } else {
    renderInterview();
  }
});
document.getElementById('finish').addEventListener('click', () => {
  if (confirm('确定提前结束面试吗？已完成题目将计入报告。')) { renderReport(); showView('report'); }
});
document.getElementById('view-report').addEventListener('click', () => { renderReport(); showView('report'); });

/* ==================== 报告 ==================== */
function renderReport() {
  const content = document.getElementById('report-content');
  content.innerHTML = `
    <div class="report-head">
      <h1 class="report-title">面试评估报告</h1>
      <div class="report-meta"><span class="tag seal">${dirLabel(REPORT.direction)}</span><span class="tag">${statusLabel(REPORT.status)}</span></div>
    </div>
    <section class="card"><h2 class="card-title">总体评价</h2><div class="card-body">${REPORT.overall_evaluation}</div></section>
    <section class="card"><h2 class="card-title">改进建议</h2><div class="card-body">${REPORT.improvement_suggestions}</div></section>
    <section class="card"><h2 class="card-title">逐题点评</h2>
      ${REPORT.questions.map(q => `
        <div class="review">
          <div class="review-q">${q.question_content}</div>
          <div class="review-a"><span class="review-label">我的回答</span><div class="review-body">${q.user_answer}</div></div>
          <div class="review-f"><span class="review-label">点评</span><div class="review-body">${q.feedback}</div></div>
        </div>`).join('')}
    </section>`;
}

/* ==================== 历史 ==================== */
function renderHistory() {
  const list = document.getElementById('history-list');
  document.getElementById('history-count').textContent = HISTORY.length ? `共 ${HISTORY.length} 场` : '';
  list.innerHTML = '';
  HISTORY.forEach(s => {
    const li = document.createElement('li');
    li.className = 'list-item';
    const meta = `${s.total_questions} 题 · ${s.started_at}`;
    if (s.status === 'completed' || s.status === 'finished') {
      li.innerHTML = `
        <a class="list-item-main" href="#" style="flex:1"><div class="list-item-name"></div><div class="list-item-desc"></div></a>
        <div class="list-item-side"><span class="tag ${s.status}"></span><span class="arrow">›</span></div>`;
      li.querySelector('.list-item-name').textContent = dirLabel(s.direction);
      li.querySelector('.list-item-desc').textContent = meta;
      li.querySelector('.tag').textContent = statusLabel(s.status);
      li.querySelector('.list-item-main').addEventListener('click', e => { e.preventDefault(); renderReport(); showView('report'); });
    } else {
      li.classList.add('muted');
      li.innerHTML = `
        <div class="list-item-main"><div class="list-item-name"></div><div class="list-item-desc"></div></div>
        <div class="list-item-side"><span class="tag in_progress"></span></div>`;
      li.querySelector('.list-item-name').textContent = dirLabel(s.direction);
      li.querySelector('.list-item-desc').textContent = meta;
      li.querySelector('.tag').textContent = statusLabel(s.status);
    }
    list.appendChild(li);
  });
}
document.querySelectorAll('[data-nav="history"]').forEach(a => a.addEventListener('click', () => { renderHistory(); }));

/* ==================== 启动：默认显示登录 ==================== */
showView('login');
</script>
</body>
</html>

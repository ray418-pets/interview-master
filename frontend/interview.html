<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试进行中 · 面试陪练</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="interview">

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html"><img src="assets/logo-mark.svg" alt="">面试陪练</a>
    <div class="topbar-right">
      <span class="user-name" id="username"></span>
      <a class="nav-link" href="index.html">开始面试</a>
      <a class="nav-link" href="history.html">历史记录</a>
      <a class="nav-link" href="#" id="logout">退出</a>
    </div>
  </div>
</header>

<main class="wrap-narrow interview">

  <div class="progress-row">
    <span class="progress" id="progress">准备中…</span>
    <button class="finish-link" id="finish" type="button">提前结束面试</button>
  </div>
  <div class="progress-bar"><div class="progress-bar-fill" id="progress-bar-fill"></div></div>

  <div class="conversation" id="conversation"></div>

  <section class="current-question" id="current-block">
    <div class="current-label">面试官提问</div>
    <blockquote class="current-text" id="current-text"></blockquote>
    <textarea class="textarea" id="answer" placeholder="在这里输入你的回答…"></textarea>
    <div class="form-hint" id="hint"></div>
    <div class="submit-row">
      <button class="btn btn-primary" id="submit" type="button">提交回答</button>
    </div>
  </section>

  <section class="done-box" id="done-block" style="display:none;">
    <div class="done-text" id="done-text">面试已结束</div>
    <button class="btn btn-primary" id="view-report" type="button">查看评估报告</button>
  </section>

</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/mock.js"></script>
<script src="js/app.js"></script>
</body>
</html>

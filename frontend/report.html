<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评估报告 · 面试陪练</title>
<style>
  :root {
    --paper: #F2F4F5;
    --ink: #14212B;
    --seal: #C53A2E;
    --slate: #5B6770;
    --hairline: #D7DDE1;
    --white: #FFFFFF;
    --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  .topbar { border-bottom: 1px solid var(--hairline); background: var(--paper); }
  .topbar-inner {
    max-width: 1000px; margin: 0 auto; padding: 0 24px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-family: var(--serif); font-size: 1.125rem; font-weight: 600; letter-spacing: 0.02em; }
  .topbar-right { display: flex; align-items: center; gap: 20px; }
  .user-name { font-size: 0.9375rem; color: var(--ink); }
  .nav-link { font-size: 0.9375rem; color: var(--slate); }
  .nav-link:hover { color: var(--ink); }

  .report { padding: 40px 0 80px; }

  .report-head { margin-bottom: 36px; }
  .report-title { font-family: var(--serif); font-size: 1.75rem; font-weight: 600; margin: 0 0 8px; }
  .report-meta { font-size: 0.9375rem; color: var(--slate); }
  .report-meta .tag {
    display: inline-block; margin-right: 8px; padding: 2px 10px;
    border: 1px solid var(--hairline); border-radius: 999px; background: var(--white);
  }

  .card { background: var(--white); border: 1px solid var(--hairline); border-radius: 10px; padding: 24px; margin-bottom: 20px; }
  .card-title { font-family: var(--serif); font-size: 1.125rem; font-weight: 600; margin: 0 0 12px; }
  .card-body { color: var(--ink); white-space: pre-wrap; }

  .review { border-top: 1px solid var(--hairline); padding: 22px 0; }
  .review:first-of-type { border-top: none; }
  .review-q { font-family: var(--serif); font-size: 1.0625rem; font-weight: 600; margin-bottom: 14px; }
  .review-a, .review-f { margin-bottom: 12px; }
  .review-label { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--slate); margin-bottom: 4px; }
  .review-f .review-body { color: var(--slate); }
  .review-body { white-space: pre-wrap; }

  .error { display: none; color: var(--seal); font-size: 0.9375rem; margin-top: 16px; }
  .error.visible { display: block; }
  .loading { color: var(--slate); padding: 24px 0; }

  .back {
    display: inline-block; margin-top: 8px; padding: 12px 24px;
    border: 1px solid var(--ink); border-radius: 6px; font-weight: 600;
  }
  .back:hover { background: var(--white); }

  :focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">面试陪练</div>
    <div class="topbar-right">
      <span class="user-name" id="username"></span>
      <a class="nav-link" href="history.html">历史记录</a>
      <a class="nav-link" href="#" id="logout">退出</a>
    </div>
  </div>
</header>

<main class="wrap report">
  <div id="content"><div class="loading">报告加载中…</div></div>
  <a class="back" href="history.html">返回历史</a>
</main>

<script src="js/api.js"></script>
<script>
  const auth = requireAuth();
  document.getElementById('username').textContent = (auth && auth.username) || '';
  document.getElementById('logout').addEventListener('click', (e) => {
    e.preventDefault();
    clearAuth();
    window.location.href = 'login.html';
  });

  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session_id');
  const contentEl = document.getElementById('content');

  function renderReport(r) {
    const head = document.createElement('div');
    head.className = 'report-head';
    const title = document.createElement('h1');
    title.className = 'report-title';
    title.textContent = '面试评估报告';
    const meta = document.createElement('div');
    meta.className = 'report-meta';
    const dirTag = document.createElement('span');
    dirTag.className = 'tag';
    dirTag.textContent = directionLabel(r.direction);
    const statusTag = document.createElement('span');
    statusTag.className = 'tag';
    statusTag.textContent = statusLabel(r.status);
    meta.appendChild(dirTag);
    meta.appendChild(statusTag);
    head.appendChild(title);
    head.appendChild(meta);

    const overall = document.createElement('section');
    overall.className = 'card';
    overall.innerHTML = '<h2 class="card-title">总体评价</h2>';
    const overallBody = document.createElement('div');
    overallBody.className = 'card-body';
    overallBody.textContent = r.overall_evaluation;
    overall.appendChild(overallBody);

    const suggestions = document.createElement('section');
    suggestions.className = 'card';
    suggestions.innerHTML = '<h2 class="card-title">改进建议</h2>';
    const sugBody = document.createElement('div');
    sugBody.className = 'card-body';
    sugBody.textContent = r.improvement_suggestions;
    suggestions.appendChild(sugBody);

    const reviews = document.createElement('section');
    reviews.className = 'card';
    reviews.innerHTML = '<h2 class="card-title">逐题点评</h2>';
    (r.questions || []).forEach(q => {
      const item = document.createElement('div');
      item.className = 'review';

      const qq = document.createElement('div');
      qq.className = 'review-q';
      qq.textContent = q.question_content;

      const aa = document.createElement('div');
      aa.className = 'review-a';
      aa.innerHTML = '<span class="review-label">我的回答</span>';
      const aBody = document.createElement('div');
      aBody.className = 'review-body';
      aBody.textContent = q.user_answer;
      aa.appendChild(aBody);

      const ff = document.createElement('div');
      ff.className = 'review-f';
      ff.innerHTML = '<span class="review-label">点评</span>';
      const fBody = document.createElement('div');
      fBody.className = 'review-body';
      fBody.textContent = q.feedback;
      ff.appendChild(fBody);

      item.appendChild(qq);
      item.appendChild(aa);
      item.appendChild(ff);
      reviews.appendChild(item);
    });

    contentEl.innerHTML = '';
    contentEl.appendChild(head);
    contentEl.appendChild(overall);
    contentEl.appendChild(suggestions);
    contentEl.appendChild(reviews);
  }

  function showError(message) {
    contentEl.innerHTML = '';
    const err = document.createElement('div');
    err.className = 'error visible';
    err.textContent = message;
    contentEl.appendChild(err);
  }

  async function load() {
    if (!sessionId) {
      showError('缺少会话参数');
      return;
    }
    try {
      renderReport(await getReport(sessionId));
    } catch (err) {
      showError(err.message);
    }
  }

  load();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 面试陪练</title>
<style>
  :root {
    --paper: #F2F4F5;
    --ink: #14212B;
    --seal: #C53A2E;
    --slate: #5B6770;
    --hairline: #D7DDE1;
    --white: #FFFFFF;
    --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .topbar { border-bottom: 1px solid var(--hairline); }
  .topbar-inner {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
  }
  .brand { font-family: var(--serif); font-size: 1.125rem; font-weight: 600; }
  .auth {
    max-width: 420px;
    margin: 0 auto;
    padding: 72px 24px 64px;
  }
  .auth-title {
    font-family: var(--serif);
    font-size: 1.75rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  .auth-sub {
    color: var(--slate);
    font-size: 0.9375rem;
    margin: 0 0 32px;
  }
  .field { margin-bottom: 20px; }
  .field-label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; }
  .field-input {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 6px;
  }
  .field-input:focus { outline: none; border-color: var(--ink); }
  .error {
    display: none;
    color: var(--seal);
    font-size: 0.875rem;
    margin-bottom: 16px;
  }
  .error.visible { display: block; }
  .submit {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--white);
    background: var(--seal);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .submit:hover { background: #A8322A; }
  .switch {
    margin-top: 20px;
    text-align: center;
    color: var(--slate);
    font-size: 0.9375rem;
  }
  .switch a { color: var(--seal); font-weight: 600; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">面试陪练</div>
  </div>
</header>

<main class="auth">
  <h1 class="auth-title" id="title">登录</h1>
  <p class="auth-sub" id="subtitle">用一个账号，保存你的每次练习记录</p>

  <div class="error" id="error"></div>

  <form id="form">
    <div class="field">
      <label class="field-label" for="username">用户名</label>
      <input class="field-input" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label class="field-label" for="password">密码</label>
      <input class="field-input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="submit" id="submit" type="submit">登录</button>
  </form>

  <div class="switch" id="switch-line">还没有账号？<a id="switch-link">注册</a></div>
</main>

<script src="js/api.js"></script>
<script>
  let mode = 'login';

  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const submitBtn = document.getElementById('submit');
  const switchLine = document.getElementById('switch-line');
  const switchLink = document.getElementById('switch-link');
  const passwordInput = document.getElementById('password');
  const errorEl = document.getElementById('error');
  const form = document.getElementById('form');

  function render() {
    if (mode === 'login') {
      title.textContent = '登录';
      subtitle.textContent = '用一个账号，保存你的每次练习记录';
      submitBtn.textContent = '登录';
      switchLine.innerHTML = '还没有账号？<a id="switch-link">注册</a>';
      passwordInput.setAttribute('autocomplete', 'current-password');
    } else {
      title.textContent = '创建账号';
      subtitle.textContent = '注册后开始你的模拟面试';
      submitBtn.textContent = '注册';
      switchLine.innerHTML = '已有账号？<a id="switch-link">登录</a>';
      passwordInput.setAttribute('autocomplete', 'new-password');
    }
    document.getElementById('switch-link').addEventListener('click', toggle);
  }

  function toggle() {
    mode = mode === 'login' ? 'register' : 'login';
    hideError();
    render();
  }

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.add('visible');
  }

  function hideError() {
    errorEl.classList.remove('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const username = document.getElementById('username').value.trim();
    const password = passwordInput.value;
    try {
      const data = mode === 'login'
        ? await login(username, password)
        : await register(username, password);
      setAuth(data.token, data.user.username);
      window.location.href = 'index.html';
    } catch (err) {
      showError(err.message);
    }
  });

  render();
</script>

</body>
</html>

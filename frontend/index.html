<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试陪练</title>
<style>
  :root {
    --paper: #F2F4F5;
    --ink: #14212B;
    --seal: #C53A2E;
    --slate: #5B6770;
    --hairline: #D7DDE1;
    --white: #FFFFFF;
    --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- top bar ---------- */
  .topbar {
    border-bottom: 1px solid var(--hairline);
    background: var(--paper);
  }
  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }
  .brand {
    font-family: var(--serif);
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .nav-link {
    font-size: 0.9375rem;
    color: var(--slate);
  }
  .nav-link:hover { color: var(--ink); }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .user-name {
    font-size: 0.9375rem;
    color: var(--ink);
  }

  /* ---------- hero ---------- */
  .hero {
    padding: 88px 0 72px;
  }
  .turn {
    max-width: 720px;
  }
  .turn-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }
  .turn-speaker {
    font-size: 0.8125rem;
    color: var(--ink);
    font-weight: 600;
  }
  .turn-index {
    font-size: 0.8125rem;
    color: var(--slate);
  }
  .turn-question {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.5rem);
    font-weight: 500;
    line-height: 1.55;
    letter-spacing: 0.01em;
  }
  .hero-cta {
    display: inline-block;
    margin-top: 40px;
    background: var(--seal);
    color: var(--white);
    font-size: 1rem;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 6px;
  }
  .hero-cta:hover { background: #A8322A; }

  /* ---------- sections ---------- */
  .section { padding: 40px 0 56px; }
  .section-heading {
    font-family: var(--serif);
    font-size: 1.375rem;
    font-weight: 600;
    margin: 0 0 24px;
  }

  /* ---------- templates ---------- */
  .template-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--hairline);
  }
  .template-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 22px 4px;
    border-bottom: 1px solid var(--hairline);
  }
  .template-item:hover { background: var(--white); }
  .template-main { min-width: 0; }
  .template-name {
    font-size: 1.0625rem;
    font-weight: 600;
  }
  .template-desc {
    font-size: 0.875rem;
    color: var(--slate);
    margin-top: 4px;
  }
  .template-side {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
  }
  .template-count {
    font-size: 0.875rem;
    color: var(--slate);
    font-variant-numeric: tabular-nums;
  }
  .template-start {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--seal);
    white-space: nowrap;
  }

  /* ---------- custom config ---------- */
  .field { margin-bottom: 28px; }
  .field-label {
    display: block;
    font-size: 0.9375rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .field-hint {
    font-weight: 400;
    color: var(--slate);
    font-size: 0.8125rem;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chip {
    padding: 9px 16px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--white);
    color: var(--ink);
    font-size: 0.9375rem;
  }
  .chip:hover { border-color: var(--slate); }
  .chip.selected {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--white);
  }

  .stepper {
    display: inline-flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    background: var(--white);
    overflow: hidden;
  }
  .stepper-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 1.25rem;
    line-height: 1;
  }
  .stepper-btn:hover { background: var(--paper); }
  .stepper-value {
    min-width: 56px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .stepper-total {
    margin-left: 12px;
    font-size: 0.875rem;
    color: var(--slate);
  }

  .custom-cta {
    margin-top: 12px;
    background: var(--seal);
    color: var(--white);
    font-size: 1rem;
    font-weight: 600;
    padding: 14px 28px;
    border: none;
    border-radius: 6px;
  }
  .custom-cta:hover { background: #A8322A; }

  .error {
    display: none;
    color: var(--seal);
    font-size: 0.875rem;
    margin: 12px 0;
  }
  .error.visible { display: block; }

  .loading {
    color: var(--slate);
    font-size: 0.9375rem;
    padding: 16px 4px;
  }

  /* ---------- footer ---------- */
  .footer {
    border-top: 1px solid var(--hairline);
    padding: 28px 0 40px;
    color: var(--slate);
    font-size: 0.8125rem;
  }

  /* ---------- focus & motion ---------- */
  :focus-visible {
    outline: 2px solid var(--seal);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 640px) {
    .hero { padding: 56px 0 48px; }
    .template-item { flex-direction: column; align-items: flex-start; gap: 12px; }
    .template-side { justify-content: space-between; width: 100%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">面试陪练</div>
    <div class="topbar-right">
      <span class="user-name" id="username"></span>
      <a class="nav-link" href="history.html">历史记录</a>
      <a class="nav-link" href="#" id="logout">退出</a>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="turn">
      <div class="turn-head">
        <span class="turn-speaker">面试官</span>
        <span class="turn-index">第 1 题</span>
      </div>
      <blockquote class="turn-question">请先做一个简单的自我介绍，谈谈你的教育背景和最近的一段项目经历。</blockquote>
    </div>
    <a class="hero-cta" href="#templates">开始一场面试</a>
  </section>

  <section class="section" id="templates">
    <h2 class="section-heading">选一套，直接开始</h2>
    <ul class="template-list" id="template-list">
      <li class="loading">模板加载中…</li>
    </ul>
  </section>

  <section class="section">
    <h2 class="section-heading">或者，自己组合一场</h2>

    <div class="field">
      <span class="field-label">岗位方向</span>
      <div class="chips" id="direction-chips">
        <button class="chip selected" type="button" data-value="technical_frontend">技术-前端</button>
        <button class="chip" type="button" data-value="technical_backend">技术-后端</button>
        <button class="chip" type="button" data-value="technical_algorithm">技术-算法</button>
        <button class="chip" type="button" data-value="product">产品</button>
        <button class="chip" type="button" data-value="operations">运营</button>
        <button class="chip" type="button" data-value="general">通用</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">题型 <span class="field-hint">（可多选）</span></span>
      <div class="chips" id="type-chips">
        <button class="chip" type="button" data-value="self_introduction">自我介绍</button>
        <button class="chip" type="button" data-value="technical">技术题</button>
        <button class="chip" type="button" data-value="behavioral">行为题</button>
        <button class="chip" type="button" data-value="project_experience">项目经验题</button>
        <button class="chip" type="button" data-value="open_ended">开放题</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">题目数量</span>
      <div class="stepper">
        <button class="stepper-btn" id="count-minus" type="button" aria-label="减少题目">−</button>
        <span class="stepper-value" id="count-value">8</span>
        <button class="stepper-btn" id="count-plus" type="button" aria-label="增加题目">+</button>
      </div>
      <span class="stepper-total">共 8 题（1–20）</span>
    </div>

    <div class="error" id="error"></div>
    <button class="custom-cta" id="custom-start" type="button">开始面试</button>
  </section>

</main>

<footer class="footer">
  <div class="wrap">面试陪练</div>
</footer>

<script src="js/api.js"></script>
<script>
  const auth = requireAuth();
  if (!auth) {
    // requireAuth 已跳转登录页
  }
  document.getElementById('username').textContent = (auth && auth.username) || '';
  document.getElementById('logout').addEventListener('click', (e) => {
    e.preventDefault();
    clearAuth();
    window.location.href = 'login.html';
  });

  const errorEl = document.getElementById('error');
  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.add('visible');
  }
  function hideError() {
    errorEl.classList.remove('visible');
  }

  // 岗位方向：单选
  const directionChips = document.querySelectorAll('#direction-chips .chip');
  directionChips.forEach(chip => {
    chip.addEventListener('click', () => {
      directionChips.forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
    });
  });

  // 题型：多选
  const typeChips = document.querySelectorAll('#type-chips .chip');
  typeChips.forEach(chip => {
    chip.addEventListener('click', () => chip.classList.toggle('selected'));
  });

  // 题目数量：1–20
  const countValue = document.getElementById('count-value');
  const countTotal = document.querySelector('.stepper-total');
  let count = 8;
  function renderCount() {
    countValue.textContent = count;
    countTotal.textContent = `共 ${count} 题（1–20）`;
  }
  document.getElementById('count-minus').addEventListener('click', () => {
    if (count > 1) { count -= 1; renderCount(); }
  });
  document.getElementById('count-plus').addEventListener('click', () => {
    if (count < 20) { count += 1; renderCount(); }
  });

  function selectedDirection() {
    const sel = document.querySelector('#direction-chips .chip.selected');
    return sel ? sel.dataset.value : null;
  }

  function selectedTypes() {
    return Array.from(document.querySelectorAll('#type-chips .chip.selected'))
      .map(c => c.dataset.value);
  }

  function buildSegments(types, total) {
    const per = Math.floor(total / types.length);
    const remainder = total % types.length;
    return types.map((type, i) => ({ type, count: per + (i < remainder ? 1 : 0) }));
  }

  function startInterview(data) {
    sessionStorage.setItem('pending_interview', JSON.stringify(data));
    window.location.href = `interview.html?session_id=${data.session_id}`;
  }

  async function startWithTemplate(templateId) {
    hideError();
    try {
      startInterview(await createInterview({ template_id: templateId }));
    } catch (err) {
      showError(err.message);
    }
  }

  async function startCustom() {
    hideError();
    const direction = selectedDirection();
    const types = selectedTypes();
    if (!types.length) {
      showError('请至少选择一种题型');
      return;
    }
    if (count < types.length) {
      showError(`题目数量不能少于已选题型数量（${types.length}）`);
      return;
    }
    try {
      startInterview(await createInterview({ direction, segments: buildSegments(types, count) }));
    } catch (err) {
      showError(err.message);
    }
  }

  document.getElementById('custom-start').addEventListener('click', startCustom);

  // 预设模板：动态渲染
  async function loadTemplates() {
    const list = document.getElementById('template-list');
    try {
      const templates = await getTemplates();
      list.innerHTML = '';
      templates.forEach(t => {
        const li = document.createElement('li');
        li.className = 'template-item';
        const desc = (t.segments || []).map(s => `${typeLabel(s.type)} ${s.count} 题`).join('、');
        li.innerHTML = `
          <div class="template-main">
            <div class="template-name"></div>
            <div class="template-desc"></div>
          </div>
          <div class="template-side">
            <span class="template-count"></span>
            <a class="template-start" href="#">开始</a>
          </div>`;
        li.querySelector('.template-name').textContent = t.name;
        li.querySelector('.template-desc').textContent = `${directionLabel(t.direction)} · ${desc}`;
        li.querySelector('.template-count').textContent = `${totalQuestions(t.segments)} 题`;
        li.querySelector('.template-start').addEventListener('click', (e) => {
          e.preventDefault();
          startWithTemplate(t.id);
        });
        list.appendChild(li);
      });
    } catch (err) {
      list.innerHTML = '';
      const li = document.createElement('li');
      li.className = 'loading';
      li.textContent = `加载失败：${err.message}`;
      list.appendChild(li);
    }
  }

  loadTemplates();
</script>

</body>
</html>

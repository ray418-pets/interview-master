<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史记录 · 面试陪练</title>
<style>
  :root {
    --paper: #F2F4F5;
    --ink: #14212B;
    --seal: #C53A2E;
    --slate: #5B6770;
    --hairline: #D7DDE1;
    --white: #FFFFFF;
    --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  .topbar { border-bottom: 1px solid var(--hairline); background: var(--paper); }
  .topbar-inner {
    max-width: 1000px; margin: 0 auto; padding: 0 24px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-family: var(--serif); font-size: 1.125rem; font-weight: 600; letter-spacing: 0.02em; }
  .topbar-right { display: flex; align-items: center; gap: 20px; }
  .user-name { font-size: 0.9375rem; color: var(--ink); }
  .nav-link { font-size: 0.9375rem; color: var(--slate); }
  .nav-link:hover { color: var(--ink); }
  .nav-link.active { color: var(--ink); font-weight: 600; }

  .history { padding: 40px 0 80px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
  .page-title { font-family: var(--serif); font-size: 1.75rem; font-weight: 600; margin: 0; }
  .page-count { font-size: 0.9375rem; color: var(--slate); }

  .history-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hairline); }
  .history-item { border-bottom: 1px solid var(--hairline); }
  .history-link {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 22px 4px;
  }
  .history-link:hover { background: var(--white); }
  .history-main { min-width: 0; }
  .history-name { font-size: 1.0625rem; font-weight: 600; }
  .history-meta { font-size: 0.875rem; color: var(--slate); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .history-side { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  .status {
    display: inline-block; padding: 3px 12px; border-radius: 999px;
    font-size: 0.8125rem; font-weight: 600; white-space: nowrap;
  }
  .status.completed { background: var(--ink); color: var(--white); }
  .status.finished { background: var(--white); color: var(--slate); border: 1px solid var(--hairline); }
  .status.in_progress { background: var(--white); color: var(--slate); border: 1px solid var(--hairline); }
  .arrow { color: var(--slate); font-size: 1.125rem; }

  .muted { opacity: 0.6; }
  .loading, .empty { color: var(--slate); padding: 24px 4px; font-size: 0.9375rem; }
  .error { display: none; color: var(--seal); font-size: 0.9375rem; padding: 24px 4px; }
  .error.visible { display: block; }

  .start-link { color: var(--seal); font-weight: 600; }
  .start-link:hover { text-decoration: underline; }

  :focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
  @media (max-width: 640px) {
    .history-link { flex-direction: column; align-items: flex-start; gap: 10px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">面试陪练</div>
    <div class="topbar-right">
      <span class="user-name" id="username"></span>
      <a class="nav-link" href="index.html">开始面试</a>
      <a class="nav-link active" href="history.html">历史记录</a>
      <a class="nav-link" href="#" id="logout">退出</a>
    </div>
  </div>
</header>

<main class="wrap history">
  <div class="page-head">
    <h1 class="page-title">历史记录</h1>
    <span class="page-count" id="count"></span>
  </div>
  <ul class="history-list" id="history-list">
    <li class="loading">加载中…</li>
  </ul>
  <div class="error" id="error"></div>
</main>

<script src="js/api.js"></script>
<script>
  const auth = requireAuth();
  document.getElementById('username').textContent = (auth && auth.username) || '';
  document.getElementById('logout').addEventListener('click', (e) => {
    e.preventDefault();
    clearAuth();
    window.location.href = 'login.html';
  });

  const listEl = document.getElementById('history-list');
  const countEl = document.getElementById('count');
  const errorEl = document.getElementById('error');

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function buildItem(s) {
    const li = document.createElement('li');
    li.className = 'history-item';

    const meta = `${s.total_questions} 题 · ${formatDate(s.started_at)}`;
    const status = statusLabel(s.status);

    if (s.status === 'completed' || s.status === 'finished') {
      const link = document.createElement('a');
      link.className = 'history-link';
      link.href = `report.html?session_id=${s.id}`;
      link.innerHTML = `
        <div class="history-main">
          <div class="history-name"></div>
          <div class="history-meta"></div>
        </div>
        <div class="history-side">
          <span class="status ${s.status}"></span>
          <span class="arrow">›</span>
        </div>`;
      link.querySelector('.history-name').textContent = directionLabel(s.direction);
      link.querySelector('.history-meta').textContent = meta;
      link.querySelector('.status').textContent = status;
      li.appendChild(link);
    } else {
      const row = document.createElement('div');
      row.className = 'history-link muted';
      row.innerHTML = `
        <div class="history-main">
          <div class="history-name"></div>
          <div class="history-meta"></div>
        </div>
        <div class="history-side">
          <span class="status in_progress"></span>
        </div>`;
      row.querySelector('.history-name').textContent = directionLabel(s.direction);
      row.querySelector('.history-meta').textContent = meta;
      row.querySelector('.status').textContent = status;
      li.appendChild(row);
    }
    return li;
  }

  async function load() {
    try {
      const sessions = await listInterviews();
      countEl.textContent = sessions.length ? `共 ${sessions.length} 场` : '';
      listEl.innerHTML = '';
      if (!sessions.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.innerHTML = '暂无面试记录，<a class="start-link" href="index.html">去开始第一场面试</a>';
        listEl.appendChild(li);
        return;
      }
      sessions.forEach(s => listEl.appendChild(buildItem(s)));
    } catch (err) {
      listEl.innerHTML = '';
      errorEl.textContent = err.message;
      errorEl.classList.add('visible');
    }
  }

  load();
</script>

</body>
</html>

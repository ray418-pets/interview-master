<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户模块 Mock 测试 · 面试陪练</title>
<style>
  :root {
    --paper: #F2F4F5;
    --ink: #14212B;
    --seal: #C53A2E;
    --green: #2E7D5B;
    --slate: #5B6770;
    --hairline: #D7DDE1;
    --white: #FFFFFF;
    --sans: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: 1.75rem; margin: 0 0 8px; }
  .sub { color: var(--slate); margin: 0 0 32px; }
  .summary {
    display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .pill {
    padding: 8px 18px; border-radius: 999px; font-weight: 600; font-size: 0.9375rem;
    border: 1px solid var(--hairline); background: var(--white);
  }
  .pill.pass { color: var(--green); border-color: var(--green); }
  .pill.fail { color: var(--seal); border-color: var(--seal); }
  .results { border-top: 1px solid var(--hairline); }
  .row {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 16px 4px; border-bottom: 1px solid var(--hairline);
  }
  .row .status {
    flex-shrink: 0; width: 60px; font-weight: 700; font-size: 0.875rem; margin-top: 2px;
  }
  .status.pass { color: var(--green); }
  .status.fail { color: var(--seal); }
  .row .body { min-width: 0; }
  .row .name { font-weight: 600; }
  .row .detail { color: var(--slate); font-size: 0.875rem; margin-top: 2px; word-break: break-all; }
</style>
</head>
<body>

<main class="wrap">
  <h1>用户模块 Mock 测试</h1>
  <p class="sub">使用 mock 数据（localStorage）模拟后端认证接口，验证注册 / 登录 / 认证状态逻辑。</p>

  <div class="summary" id="summary"></div>
  <div class="results" id="results"></div>
</main>

<script>window.__USE_MOCK__ = true;</script>
<script src="../js/mock.js"></script>
<script src="../js/api.js"></script>
<script>
  var results = [];
  var summaryEl = document.getElementById('summary');
  var resultsEl = document.getElementById('results');

  function assert(cond, msg) {
    if (!cond) throw new Error(msg || '断言失败');
  }

  function assertRejects(fn, expectedMsg) {
    return fn().then(
      function () { throw new Error('期望抛出异常，但未抛出'); },
      function (err) {
        if (expectedMsg && err.message.indexOf(expectedMsg) === -1) {
          throw new Error('期望错误包含「' + expectedMsg + '」，实际「' + err.message + '」');
        }
      }
    );
  }

  function test(name, fn) {
    return Promise.resolve()
      .then(fn)
      .then(function () { results.push({ name: name, pass: true, detail: '' }); })
      .catch(function (e) { results.push({ name: name, pass: false, detail: e.message }); });
  }

  function render() {
    var passed = results.filter(function (r) { return r.pass; }).length;
    var failed = results.length - passed;
    summaryEl.innerHTML = '';
    summaryEl.appendChild(pill('共 ' + results.length + ' 例'));
    summaryEl.appendChild(pill('通过 ' + passed + ' 例', 'pass'));
    if (failed) summaryEl.appendChild(pill('失败 ' + failed + ' 例', 'fail'));

    resultsEl.innerHTML = '';
    results.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'row';
      var status = document.createElement('div');
      status.className = 'status ' + (r.pass ? 'pass' : 'fail');
      status.textContent = r.pass ? 'PASS' : 'FAIL';
      var body = document.createElement('div');
      body.className = 'body';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = r.name;
      body.appendChild(name);
      if (r.detail) {
        var detail = document.createElement('div');
        detail.className = 'detail';
        detail.textContent = r.detail;
        body.appendChild(detail);
      }
      row.appendChild(status);
      row.appendChild(body);
      resultsEl.appendChild(row);
    });
  }

  function pill(text, cls) {
    var s = document.createElement('span');
    s.className = 'pill' + (cls ? ' ' + cls : '');
    s.textContent = text;
    return s;
  }

  function run() {
    window.__mockReset();
    clearAuth();

    return test('注册成功返回 token 与 user', function () {
      return register('alice', 'secret123').then(function (r) {
        assert(!!r.token, '应返回 token');
        assert(r.user && r.user.username === 'alice', 'user.username 应为 alice');
      });
    })
    .then(function () { return test('重复注册被拒绝（用户名已占用）', function () {
      return assertRejects(function () { return register('alice', 'other456'); }, '用户名已被占用');
    }); })
    .then(function () { return test('用户名过短被拒绝', function () {
      return assertRejects(function () { return register('ab', 'secret123'); }, '参数校验失败');
    }); })
    .then(function () { return test('密码过短被拒绝', function () {
      return assertRejects(function () { return register('bob', '123'); }, '参数校验失败');
    }); })
    .then(function () { return test('登录成功返回 token', function () {
      return login('alice', 'secret123').then(function (r) {
        assert(!!r.token, '应返回 token');
        assert(r.user.username === 'alice', 'user.username 应为 alice');
      });
    }); })
    .then(function () { return test('密码错误登录失败', function () {
      return assertRejects(function () { return login('alice', 'wrongpass'); }, '用户名或密码错误');
    }); })
    .then(function () { return test('用户不存在登录失败', function () {
      return assertRejects(function () { return login('nobody', 'secret123'); }, '用户名或密码错误');
    }); })
    .then(function () { return test('setAuth 写入认证状态', function () {
      setAuth('tok123', 'alice');
      var a = getAuth();
      assert(a.token === 'tok123', 'token 应为 tok123');
      assert(a.username === 'alice', 'username 应为 alice');
    }); })
    .then(function () { return test('clearAuth 清除认证状态', function () {
      clearAuth();
      var a = getAuth();
      assert(!a.token && !a.username, 'token 与 username 应为空');
    }); })
    .then(function () { return test('Mock 重置后用户清空', function () {
      window.__mockReset();
      return assertRejects(function () { return login('alice', 'secret123'); }, '用户名或密码错误');
    }); })
    .then(render);
  }

  run();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试配置 · 面试陪练</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html"><img src="assets/logo-mark.svg" alt="">面试陪练</a>
    <div class="topbar-right">
      <span class="user-name" id="username"></span>
      <a class="nav-link" href="index.html">开始面试</a>
      <a class="nav-link" href="history.html">历史记录</a>
      <a class="nav-link" href="#" id="logout">退出</a>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="hero-inner">
      <div class="hero-kicker">
        <span class="hero-speaker">面试官</span>
        <span class="hero-index">第 1 题</span>
      </div>
      <blockquote class="hero-question">请先做一个简单的自我介绍，谈谈你的教育背景和最近的一段项目经历。</blockquote>
      <a class="btn btn-primary" href="#templates">开始一场面试</a>
    </div>
  </section>

  <section class="section" id="templates">
    <h2 class="section-heading">选一套，直接开始</h2>
    <ul class="list" id="template-list">
      <li class="state">模板加载中…</li>
    </ul>
  </section>

  <section class="section">
    <h2 class="section-heading">或者，自己组合一场</h2>

    <div class="field">
      <span class="field-label">岗位方向</span>
      <div class="chips" id="direction-chips">
        <button class="chip selected" type="button" data-value="technical_frontend">技术-前端</button>
        <button class="chip" type="button" data-value="technical_backend">技术-后端</button>
        <button class="chip" type="button" data-value="technical_algorithm">技术-算法</button>
        <button class="chip" type="button" data-value="product">产品</button>
        <button class="chip" type="button" data-value="operations">运营</button>
        <button class="chip" type="button" data-value="general">通用</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">题型 <span class="field-hint">（可多选）</span></span>
      <div class="chips" id="type-chips">
        <button class="chip" type="button" data-value="self_introduction">自我介绍</button>
        <button class="chip selected" type="button" data-value="technical">技术题</button>
        <button class="chip selected" type="button" data-value="behavioral">行为题</button>
        <button class="chip" type="button" data-value="project_experience">项目经验题</button>
        <button class="chip" type="button" data-value="open_ended">开放题</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">题目数量</span>
      <div class="stepper">
        <button class="stepper-btn" id="count-minus" type="button" aria-label="减少题目">−</button>
        <span class="stepper-value" id="count-value">8</span>
        <button class="stepper-btn" id="count-plus" type="button" aria-label="增加题目">+</button>
      </div>
      <span class="stepper-total" id="count-total">共 8 题（1–20）</span>
    </div>

    <div class="form-error" id="error"></div>
    <button class="btn btn-primary" id="custom-start" type="button">开始面试</button>
  </section>

</main>

<footer class="footer">
  <div class="wrap">面试陪练</div>
</footer>

<script src="js/api.js"></script>
<script src="js/mock.js"></script>
<script src="js/app.js"></script>
</body>
</html>

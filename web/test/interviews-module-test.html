<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试模块 Mock 测试 · 面试陪练</title>
<link rel="stylesheet" href="harness.css">
</head>
<body>

<main class="wrap">
  <h1>面试模块 Mock 测试</h1>
  <p class="sub">使用 mock 数据验证创建会话、逐题作答、提前结束、历史列表与归属隔离。</p>

  <div class="summary" id="summary"></div>
  <div class="results" id="results"></div>
</main>

<script>window.__USE_MOCK__ = true;</script>
<script src="../js/mock.js"></script>
<script src="../js/api.js"></script>
<script src="harness.js"></script>
<script>
  var aliceSessionId = null;
  var answer = '这是一个足够长的回答内容，覆盖要点一。';

  function run() {
    window.__mockReset();
    clearAuth();

    return register('alice', 'secret123')
      .then(function () {
        return test('按模板创建会话返回第一题', function () {
          return createInterview({ template_id: 1 }).then(function (s) {
            assert(typeof s.session_id === 'number', 'session_id 应为数字');
            assert(s.total_questions > 0, 'total_questions 应大于 0');
            assert(s.status === 'in_progress', 'status 应为 in_progress');
            assert(s.current_question.round_index === 0, '第一题 round_index 应为 0');
            assert(!!s.current_question.content, '第一题应包含题干');
          });
        });
      })
      .then(function () {
        return test('自定义配置创建会话', function () {
          return createInterview({ direction: 'general', segments: [{ type: 'behavioral', count: 2 }] }).then(function (s) {
            assert(s.total_questions === 2, 'total_questions 应为 2');
          });
        });
      })
      .then(function () {
        return test('无配置创建被拒绝', function () {
          return assertRejects(function () { return createInterview({}); }, '必须提供模板或自定义配置');
        });
      })
      .then(function () {
        return test('提交回答返回点评与下一题', function () {
          return createInterview({ direction: 'general', segments: [{ type: 'behavioral', count: 2 }] }).then(function (s) {
            aliceSessionId = s.session_id;
            return submitAnswer(s.session_id, answer);
          }).then(function (r) {
            assert(!!r.feedback, '应返回点评');
            assert(r.is_finished === false, '非最后一题 is_finished 应为 false');
            assert(r.next_question && r.next_question.round_index === 1, '下一题 round_index 应为 1');
          });
        });
      })
      .then(function () {
        return test('最后一题提交完成', function () {
          return createInterview({ direction: 'general', segments: [{ type: 'behavioral', count: 1 }] }).then(function (s) {
            return submitAnswer(s.session_id, answer);
          }).then(function (r) {
            assert(r.is_finished === true, '最后一题 is_finished 应为 true');
            assert(r.next_question === null, '最后一题 next_question 应为 null');
          });
        });
      })
      .then(function () {
        return test('过短回答被拦截', function () {
          return createInterview({ direction: 'general', segments: [{ type: 'behavioral', count: 2 }] }).then(function (s) {
            return submitAnswer(s.session_id, '太短');
          }).then(function (r) {
            assert(r.feedback.indexOf('过短') !== -1, '反馈应包含「过短」');
            assert(r.is_finished === false, '过短回答 is_finished 应为 false');
            assert(r.next_question.round_index === 0, '过短回答不推进轮次');
          });
        });
      })
      .then(function () {
        return test('提前结束面试', function () {
          return createInterview({ direction: 'general', segments: [{ type: 'behavioral', count: 1 }] }).then(function (s) {
            return finishInterview(s.session_id);
          }).then(function (r) {
            assert(r.status === 'finished', 'status 应为 finished');
          });
        });
      })
      .then(function () {
        return test('历史列表仅含当前用户会话', function () {
          return listInterviews().then(function (list) {
            assert(Array.isArray(list), '应返回数组');
            assert(list.length >= 1, '应包含至少一条会话');
            list.forEach(function (item) {
              assert(typeof item.id === 'number', 'id 应为数字');
              assert(!!item.direction, 'direction 应存在');
              assert(typeof item.total_questions === 'number', 'total_questions 应为数字');
              assert(!!item.status, 'status 应存在');
            });
          });
        });
      })
      .then(function () {
        return test('跨用户访问被拒绝', function () {
          return register('bob', 'secret123').then(function () {
            return assertRejects(function () { return submitAnswer(aliceSessionId, answer); }, '无权访问该会话');
          });
        });
      })
      .then(renderResults);
  }

  run();
</script>

</body>
</html>

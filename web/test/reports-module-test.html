<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告模块 Mock 测试 · 面试陪练</title>
<link rel="stylesheet" href="harness.css">
</head>
<body>

<main class="wrap">
  <h1>报告模块 Mock 测试</h1>
  <p class="sub">使用 mock 数据验证评估报告的生成、逐题点评、完成度与归属隔离。</p>

  <div class="summary" id="summary"></div>
  <div class="results" id="results"></div>
</main>

<script>window.__USE_MOCK__ = true;</script>
<script src="../js/mock.js"></script>
<script src="../js/api.js"></script>
<script src="harness.js"></script>
<script>
  var aliceSessionId = null;
  var answer = '这是一个足够长的回答内容，覆盖要点一。';

  function run() {
    window.__mockReset();
    clearAuth();

    return register('alice', 'secret123')
      .then(function () {
        return test('完成会话报告包含逐题点评', function () {
          return createInterview({ direction: 'general', segments: [{ type: 'behavioral', count: 2 }] }).then(function (s) {
            return submitAnswer(s.session_id, answer).then(function () {
              return submitAnswer(s.session_id, answer);
            }).then(function () {
              return getReport(s.session_id);
            });
          }).then(function (r) {
            assert(!!r.overall_evaluation, '应包含总体评价');
            assert(!!r.improvement_suggestions, '应包含改进建议');
            assert(r.questions.length === 2, '逐题点评应为 2 条');
            assert(!!r.questions[0].question_content, '点评应包含题干');
            assert(!!r.questions[0].user_answer, '点评应包含回答');
            assert(!!r.questions[0].feedback, '点评应包含 AI 点评');
          });
        });
      })
      .then(function () {
        return test('提前结束报告仅含已答题目', function () {
          return createInterview({ direction: 'general', segments: [{ type: 'behavioral', count: 2 }] }).then(function (s) {
            return submitAnswer(s.session_id, answer).then(function () {
              return finishInterview(s.session_id);
            }).then(function () {
              return getReport(s.session_id);
            });
          }).then(function (r) {
            assert(r.status === 'finished', 'status 应为 finished');
            assert(r.questions.length === 1, '仅含 1 条已答点评');
          });
        });
      })
      .then(function () {
        return test('进行中会话查报告被拒绝', function () {
          return createInterview({ direction: 'general', segments: [{ type: 'behavioral', count: 2 }] }).then(function (s) {
            return assertRejects(function () { return getReport(s.session_id); }, '面试尚未完成');
          });
        });
      })
      .then(function () {
        return test('跨用户查报告被拒绝', function () {
          return createInterview({ direction: 'general', segments: [{ type: 'behavioral', count: 1 }] }).then(function (s) {
            aliceSessionId = s.session_id;
            return submitAnswer(s.session_id, answer);
          }).then(function () {
            return register('bob', 'secret123');
          }).then(function () {
            return assertRejects(function () { return getReport(aliceSessionId); }, '无权访问该会话');
          });
        });
      })
      .then(renderResults);
  }

  run();
</script>

</body>
</html>
